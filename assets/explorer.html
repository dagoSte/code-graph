<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="__CG_CSP__">
  <title>code-graph · Esplora</title>
  <style data-cg-inline>
    :root { color-scheme: light; font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #292c3d; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: grid; grid-template-rows: 70px minmax(0,1fr); }
    button,input,select { font: inherit; }
    button,select { cursor: pointer; }
    button { color: #33465e; background: white; border: 1px solid #dce3ed; border-radius: 7px; padding: 7px 11px; }
    button:hover { background: #eff5ff; border-color: #a8bdd9; }
    button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline: 3px solid #a392ec; outline-offset: 3px; }
    [hidden] { display: none !important; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 0 25px; background: white; border-bottom: 1px solid #dfe6f0; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: white; background: #8069e0; font-size: 24px; }
    h1 { font-size: 17px; letter-spacing: -.4px; margin: 0; }
    h1 span { font-weight: 400; color: #7c899c; }
    #project { color: #6b7890; font-size: 12px; overflow-wrap: anywhere; }
    .snapshot { text-align: right; font-size: 12px; color: #6b7890; }
    .workspace { display: grid; grid-template-columns: 265px minmax(260px,1fr) 295px; min-height: 0; }
    aside { background: #fff; min-height: 0; overflow: auto; }
    .filters { display: flex; flex-direction: column; border-right: 1px solid #dfe6f0; }
    .controls { padding: 20px 18px 16px; border-bottom: 1px solid #edf0f5; }
    label { display: block; font-weight: 600; color: #56667d; font-size: 11px; margin-bottom: 6px; }
    input,select { width: 100%; border: 1px solid #d9e1ec; border-radius: 7px; color: #292c3d; background: #fff; padding: 9px 10px; }
    input { background: #f7f9fd; }
    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 13px; }
    .module-field { margin-top: 13px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 7px; color: #7b889c; font-size: 11px; }
    #results { min-height: 80px; flex: 1; overflow: auto; padding: 0 8px 12px; }
    .result,.neighbor { display: block; width: 100%; border: 0; border-radius: 6px; text-align: left; padding: 10px; margin-bottom: 3px; background: transparent; }
    .result[aria-current=true] { background: #f0edfc; color: #1d579d; }
    .result strong,.neighbor strong { display: block; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
    .result small,.neighbor small { display: block; color: #75849a; font-size: 10px; overflow-wrap: anywhere; margin-top: 3px; }
    .legend { padding: 12px 18px; border-top: 1px solid #edf0f5; color: #748198; font-size: 10px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8069e0; margin-right: 4px; }
    .dot.method { background: #2f9a88; margin-left: 10px; }
    .dot.class { background: #a07ac8; margin-left: 10px; }
    main { position: relative; min-width: 0; min-height: 0; background-color: #f6f7fb; background-image: radial-gradient(#e0dfeb .8px,transparent .8px); background-size: 18px 18px; }
    .toolbar { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; gap: 8px; z-index: 1; pointer-events: none; }
    .toolbar>div { display: flex; gap: 5px; align-items: center; pointer-events: auto; }
    .toolbar button { box-shadow: 0 2px 6px #292c3d08; font-size: 12px; }
    .toolbar select { padding: 7px 8px; width: auto; font-size: 12px; }
    #graph { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #graph.dragging { cursor: grabbing; }
    .edge { fill: none; stroke: #c8c2dd; stroke-width: 1.5; }
    .edge.low { stroke-dasharray: 5 5; opacity: .6; }
    .edge.highlight { stroke: #8c78cb; stroke-width: 2; }
    .node { cursor: pointer; }
    .node rect { fill: #fff; stroke: #dedbea; stroke-width: 1.2; filter: drop-shadow(0 2px 3px #23426408); }
    .node.selected rect { fill: #f0edfc; stroke: #8069e0; stroke-width: 2; }
    .node .stripe { fill: #8069e0; }
    .node.method .stripe { fill: #2f9a88; }
    .node.class .stripe,.node.interface .stripe,.node.trait .stripe,.node.enum .stripe { fill: #a07ac8; }
    .node.module .stripe { fill: #92a1b4; }
    .node text { pointer-events: none; font-family: inherit; }
    .node-name { fill: #353448; font-size: 12px; font-weight: 600; }
    .node-file { fill: #797b94; font-size: 10px; }
    .stage-foot { position: absolute; left: 20px; right: 20px; bottom: 15px; color: #78879b; font-size: 11px; pointer-events: none; display: flex; justify-content: space-between; gap: 15px; }
    #empty { position: absolute; top: 45%; left: 10%; right: 10%; text-align: center; color: #7d8ba0; pointer-events: none; }
    #details { border-left: 1px solid #dfe6f0; padding: 23px 20px; }
    .eyebrow { font-size: 10px; color: #8290a3; font-weight: 600; text-transform: uppercase; letter-spacing: 1.1px; margin-bottom: 10px; }
    h2 { font-size: 18px; line-height: 1.4; letter-spacing: -.3px; margin: 0 0 9px; overflow-wrap: anywhere; }
    h3 { font-size: 11px; color: #6c7d94; margin: 24px 0 7px; text-transform: uppercase; letter-spacing: .7px; }
    .location { font-size: 11px; color: #3c6ea9; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; color: #5d6d84; background: #f5f7fb; padding: 12px; border: 1px solid #e9edf4; border-radius: 6px; margin: 16px 0; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .metric { padding: 12px; background: #f7f9fc; border-radius: 7px; color: #8190a4; font-size: 10px; }
    .metric strong { display: block; font-size: 22px; line-height: 1.3; color: #384e6b; font-weight: 500; }
    .note { font-size: 11px; color: #7c899b; line-height: 1.7; }
    .confidence { font-size: 10px; font-weight: 500; color: #7187a2; }
    .neighbor { padding: 8px 0; border-bottom: 1px solid #f0f3f7; border-radius: 0; }
    .more { display: block; margin: 8px auto; font-size: 11px; }
    #copy { margin-top: 9px; padding: 5px 8px; font-size: 10px; }
    body.embedded { height: 100dvh; grid-template-rows: minmax(0,1fr); }
    .embedded header,.embedded .filters,.embedded #details { display: none; }
    .embedded .workspace { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr); }
    @media(max-width:1100px) { .workspace { grid-template-columns: 230px minmax(200px,1fr) 250px; } header { padding: 0 18px; } .toolbar { left: 10px; right: 10px; } .toolbar select { max-width: 100px; } }
    @media(max-width:820px) { body { height: auto; min-height: 100dvh; grid-template-rows: 70px auto; } .workspace { grid-template-columns: 220px minmax(0,1fr); grid-template-rows: 65dvh auto; } #details { grid-column: 1/-1; border-left: 0; border-top: 1px solid #dfe6f0; } .snapshot { max-width: 140px; font-size: 10px; } .stage-foot span:last-child { display: none; } }
    @media(max-width:520px) { .workspace { grid-template-columns: 1fr; grid-template-rows: auto 65dvh auto; } .filters { max-height: 350px; border: 0; } .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; } .controls>div:first-child { grid-column: 1/-1; } .filter-row,.module-field { margin: 0; } .list-header { padding-top: 6px; } #results { max-height: 100px; min-height: 40px; } .legend { display: none; } .toolbar button { padding: 7px; } }
    :root[data-theme=dark]{color-scheme:dark;color:#e5e6f2;background:#141620}
    [data-theme=dark] main{background-color:#141620;background-image:radial-gradient(#353349 .8px,transparent .8px)}
    [data-theme=dark] button,[data-theme=dark] select,[data-theme=dark] input,[data-theme=dark] aside,[data-theme=dark] header{background:#202231;color:#e5e6f2;border-color:#3a3b50}
    [data-theme=dark] .node rect{fill:#202231;stroke:#676079}[data-theme=dark] .node.selected rect{fill:#373049;stroke:#c2adff}
    [data-theme=dark] .node-name{fill:#e5e6f2}[data-theme=dark] .node-file,[data-theme=dark] .stage-foot,[data-theme=dark] .note{fill:#b0b5cd;color:#b0b5cd}
    [data-theme=dark] .edge{stroke:#655d7b}[data-theme=dark] .edge.highlight{stroke:#c2adff}
    [data-theme=dark] pre,[data-theme=dark] .metric{background:#191b29;color:#d4ceef;border-color:#3a3b50}
    [data-theme=dark] .metric strong{color:#e5e6f2}[data-theme=dark] .result[aria-current=true]{background:#373049;color:#c2adff}
  </style>

<body>
  <header>
    <div class="brand"><div class="brand-icon" aria-hidden="true">⌘</div><div><h1>code-graph <span>/ esplora</span></h1><div id="project"></div></div></div>
    <div class="snapshot"><div id="summary"></div><div id="indexed"></div></div>
  </header>
  <div class="workspace">
    <aside class="filters" aria-label="Ricerca e filtri">
      <div class="controls">
        <div><label for="search">Cerca un simbolo o un file</label><input id="search" type="search" placeholder="Es. OrderService, checkout…" autocomplete="off"></div>
        <div class="filter-row">
          <div><label for="kind">Tipo</label><select id="kind"><option value="">Tutti i tipi</option></select></div>
          <div><label for="confidence">Confidenza</label><select id="confidence"><option value="high">Alta</option><option value="medium" selected>Media e alta</option><option value="low">Tutte</option></select></div>
        </div>
        <div class="module-field"><label for="module">Modulo</label><select id="module"><option value="">Tutti i moduli</option></select></div>
      </div>
      <div class="list-header"><span>SIMBOLI</span><span id="result-count" aria-live="polite"></span></div>
      <div id="results"></div>
      <div class="legend"><span class="dot"></span>funzione<span class="dot method"></span>metodo<span class="dot class"></span>classe</div>
    </aside>
    <main aria-label="Grafo delle chiamate">
      <div class="toolbar">
        <div><button id="overview">Panoramica</button><select id="depth" aria-label="Profondità dei vicini"><option value="1">1 passaggio</option><option value="2">2 passaggi</option></select></div>
        <div><button id="zoom-out" aria-label="Riduci zoom">−</button><button id="fit">Adatta</button><button id="zoom-in" aria-label="Aumenta zoom">+</button></div>
      </div>
      <svg id="graph" aria-label="Simboli e chiamate; usa i risultati per navigare anche da tastiera">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aadc4"></path></marker></defs>
        <g id="viewport"><g id="edges"></g><g id="nodes"></g></g>
      </svg>
      <div id="empty" hidden>Nessun simbolo corrisponde ai filtri.</div>
      <div class="stage-foot"><span id="view-count" role="status"></span><span>Trascina per spostare · Scorri per zoomare</span></div>
    </main>
    <aside id="details" aria-label="Dettagli del simbolo"></aside>
  </div>
  <script id="graph-data" type="application/json">__CG_DATA__</script>
  <script data-cg-inline>
    'use strict';
    const data = JSON.parse(document.getElementById('graph-data').textContent);
    document.documentElement.dataset.theme=data.theme||'light';document.documentElement.lang=data.language||'it';
    const translations={"Panoramica": "Overview", "Adatta": "Fit", "1 passaggio": "1 step", "2 passaggi": "2 steps", "Esplora": "Explore", "Tutti": "All", "Modulo": "Module", "Tipo": "Type", "Confidenza": "Confidence", "Cerca simboli o file": "Search symbols or files", "GRAFO DELLE CHIAMATE": "CALL GRAPH", "Segui il codice.": "Follow the code.", "Seleziona un simbolo per esplorare chi lo chiama e cosa chiama.": "Select a symbol to explore its callers and callees.", "Copia posizione": "Copy location", "Chiamanti": "Callers", "Chiamati": "Callees", "nodi esportati": "exported nodes", "collegamenti": "links", "Altri risultati": "More results", "Nessun simbolo corrisponde ai filtri.": "No symbols match these filters.", "Nessun collegamento trovato.": "No link found."};
    Object.assign(translations,{"Cerca un simbolo o un file": "Search for a symbol or file", "Ricerca e filtri": "Search and filters", "Es. OrderService, checkout…": "E.g. OrderService, checkout…", "Tutti i tipi": "All types", "Alta": "High", "Media e alta": "Medium and high", "Tutte": "All", "Tutti i moduli": "All modules", "SIMBOLI": "SYMBOLS", "funzione": "function", "metodo": "method", "classe": "class", "interfaccia": "interface", "modulo": "module", "Grafo delle chiamate": "Call graph", "Profondità dei vicini": "Neighbor depth", "Riduci zoom": "Zoom out", "Aumenta zoom": "Zoom in", "Simboli e chiamate; usa i risultati per navigare anche da tastiera": "Symbols and calls; use results for keyboard navigation", "Trascina per spostare · Scorri per zoomare": "Drag to pan · Scroll to zoom", "Dettagli del simbolo": "Symbol details", "Come esplorare": "How to explore", "Cerca un nome o un file, filtra per modulo e seleziona un nodo. Le frecce seguono la direzione delle chiamate. Puoi trascinare i nodi e spostare la vista.": "Search by name or file, filter by module and select a node. Arrows follow call direction. Drag nodes or pan the view.", "Copiata": "Copied", "Seleziona e copia la posizione sopra": "Select and copy the location above", "Chiamato da": "Called by", "Chiama": "Calls", "Nessun collegamento a questa confidenza.": "No link at this confidence.", "Una mappa, da verificare": "A map to verify", "Root del progetto": "Project root", "/ esplora": "/ explore"});
    const cgTr=text=>data.language==='en'?(translations[text]||text):text;
    if(data.language==='en'){const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const items=[];while(walker.nextNode())items.push(walker.currentNode);for(const node of items){if(!['SCRIPT','STYLE'].includes(node.parentElement.tagName)){const text=node.textContent.trim();if(translations[text])node.textContent=node.textContent.replace(text,translations[text]);}}for(const node of document.querySelectorAll('[aria-label],[placeholder]'))for(const attribute of ['aria-label','placeholder']){const value=node.getAttribute(attribute);if(translations[value])node.setAttribute(attribute,translations[value]);}}

    const $ = id => document.getElementById(id);
    const ranks = {low: 1, medium: 2, high: 3};
    const names = {module: cgTr("modulo"), function: cgTr("funzione"), method: cgTr("metodo"), class: cgTr("classe"), interface: cgTr("interfaccia"), trait: 'trait', enum: 'enum'};
    const nodes = new Map(data.nodes.map(node => [node.id, node]));
    const incoming = new Map(data.nodes.map(node => [node.id, []]));
    const outgoing = new Map(data.nodes.map(node => [node.id, []]));
    for (const edge of data.edges) {
      incoming.get(edge.target)?.push(edge);
      outgoing.get(edge.source)?.push(edge);
    }
    const state = {selected: data.focus, depth: 1, positions: new Map(), visible: [], edges: [], x: 0, y: 0, scale: 1};
    const SVG = 'http://www.w3.org/2000/svg';
    const VIEW_LIMIT = 160;
    let resultLimit = 80;
    let drag = null;

    function element(tag, text, className) {
      const item = document.createElement(tag);
      if (text !== undefined) item.textContent = text;
      if (className) item.className = className;
      return item;
    }
    function svgElement(tag, attrs) {
      const item = document.createElementNS(SVG, tag);
      for (const [name, value] of Object.entries(attrs)) item.setAttribute(name, value);
      return item;
    }
    function passes(node) {
      const query = $('search').value.trim().toLocaleLowerCase();
      return (!$('kind').value || node.kind === $('kind').value)
        && (!$('module').value || node.module === $('module').value)
        && (!query || `${node.label} ${node.file}`.toLocaleLowerCase().includes(query));
    }
    function allowed(edge) { return ranks[edge.confidence] >= ranks[$('confidence').value]; }
    function degree(id) { return incoming.get(id).length + outgoing.get(id).length; }
    function sorted(list) { return list.sort((a,b) => degree(b.id) - degree(a.id) || a.label.localeCompare(b.label)); }

    function results() {
      const matches = sorted(data.nodes.filter(passes));
      $('result-count').textContent = `${matches.length}`;
      const list = $('results');
      list.replaceChildren();
      for (const node of matches.slice(0, resultLimit)) {
        const button = element('button', undefined, 'result');
        button.dataset.id = node.id;
        button.setAttribute('aria-current', String(node.id === state.selected));
        button.append(element('strong', node.label), element('small', `${node.file}:${node.line}`));
        button.addEventListener('click', () => select(node.id));
        list.append(button);
      }
      if (matches.length > resultLimit) {
        const more = element('button', (data.language==='en'?`${Math.min(80,matches.length-resultLimit)} more symbols`:`Altri ${Math.min(80, matches.length - resultLimit)} simboli`), 'more');
        more.addEventListener('click', () => {
          const firstNew = resultLimit;
          resultLimit += 80;
          results();
          $('results').querySelectorAll('.result')[firstNew]?.focus();
        });
        list.append(more);
      }
      return matches;
    }

    function select(id) {
      state.selected = id;
      $('search').value = '';
      // Navigation from a relation must stay reachable even when old filters exclude it.
      if (!passes(nodes.get(id))) {
        $('search').value = '';
        $('module').value = '';
        $('kind').value = '';
      }
      render();
      nodes.get(id).svg?.focus({preventScroll: true});
      if (data.embedded && window.parent !== window) window.parent.postMessage({type:'cg-select', id, generation:data.bridge_generation, view:data.bridge_view}, '*');
    }

    function render() {
      const matches = results();
      let candidates = matches;
      const levels = new Map();
      const permitted = new Set(matches.map(node => node.id));
      if (state.selected !== null && permitted.has(state.selected)) {
        levels.set(state.selected, 0);
        let frontier = [state.selected];
        for (let distance = 1; distance <= state.depth; distance++) {
          const next = [];
          for (const id of frontier) {
            for (const edge of [...incoming.get(id), ...outgoing.get(id)]) {
              if (!allowed(edge)) continue;
              const other = edge.source === id ? edge.target : edge.source;
              if (permitted.has(other) && !levels.has(other)) {
                const sign = edge.target === id ? -1 : 1;
                levels.set(other, (Math.sign(levels.get(id)) || sign) * distance);
                next.push(other);
              }
            }
          }
          frontier = next;
        }
        candidates = matches.filter(node => levels.has(node.id));
        candidates.sort((a,b) => (a.id === state.selected ? -1 : b.id === state.selected ? 1 : 0)
          || Math.abs(levels.get(a.id)) - Math.abs(levels.get(b.id)) || degree(b.id) - degree(a.id));
      }
      state.visible = candidates.slice(0, VIEW_LIMIT);
      const visibleIds = new Set(state.visible.map(node => node.id));
      state.edges = data.edges.filter(edge => allowed(edge) && visibleIds.has(edge.source) && visibleIds.has(edge.target));
      state.positions.clear();
      const columns = new Map();
      const focused = levels.size > 0;
      const width = focused ? 1 : Math.max(1, Math.ceil(Math.sqrt(state.visible.length / 2)));
      state.visible.forEach((node, index) => {
        const column = focused ? levels.get(node.id) : index % width;
        if (!columns.has(column)) columns.set(column, []);
        columns.get(column).push(node);
      });
      for (const [column, members] of columns) {
        members.forEach((node, row) => state.positions.set(node.id, {x: column * 270, y: (row - (members.length - 1) / 2) * 92}));
      }
      drawGraph();
      details();
      fit();
      $('empty').hidden = state.visible.length > 0;
      const suffix = candidates.length > VIEW_LIMIT ? (data.language==='en'?` · view limited to ${VIEW_LIMIT}: search or select a symbol`:` · vista limitata a ${VIEW_LIMIT}: cerca o seleziona un simbolo`) : '';
      $('view-count').textContent = `${state.visible.length} / ${candidates.length} ${data.language==='en'?'nodes':'nodi'} · ${state.edges.length} ${cgTr('collegamenti')}${suffix}`;
    }

    function drawGraph() {
      $('edges').replaceChildren();
      $('nodes').replaceChildren();
      for (const edge of state.edges) {
        const path = svgElement('path', {class: `edge ${edge.confidence}${edge.source === state.selected || edge.target === state.selected ? ' highlight' : ''}`, 'marker-end': 'url(#arrow)'});
        edge.svg = path;
        const title = svgElement('title', {});
        title.textContent = `${nodes.get(edge.source).label} → ${nodes.get(edge.target).label} [${edge.confidence}]`;
        path.append(title);
        $('edges').append(path);
      }
      for (const node of state.visible) {
        const group = svgElement('g', {class: `node ${names[node.kind] ? node.kind : 'function'}${node.id === state.selected ? ' selected' : ''}`, tabindex: 0, role: 'button', 'aria-label': `${node.label}, ${node.file}:${node.line}`, 'data-id': node.id});
        group.append(svgElement('rect', {x: -100, y: -28, width: 200, height: 56, rx: 8}));
        group.append(svgElement('rect', {x: -99, y: -20, width: 3, height: 40, rx: 1.5, class: 'stripe'}));
        const label = svgElement('text', {x: -85, y: -2, class: 'node-name'});
        label.textContent = shorten(node.label, 26);
        const file = svgElement('text', {x: -85, y: 15, class: 'node-file'});
        file.textContent = shorten(`${node.file}:${node.line}`, 32);
        const title = svgElement('title', {});
        title.textContent = `${node.label}\n${node.file}:${node.line}`;
        group.append(label, file, title);
        group.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(node.id); }
        });
        node.svg = group;
        $('nodes').append(group);
      }
      positionGraph();
    }
    function shorten(text, length) { return text.length > length ? text.slice(0,length - 1) + '…' : text; }
    function positionGraph() {
      for (const node of state.visible) {
        const p = state.positions.get(node.id);
        node.svg.setAttribute('transform', `translate(${p.x},${p.y})`);
      }
      for (const edge of state.edges) {
        const a = state.positions.get(edge.source), b = state.positions.get(edge.target);
        if (edge.source === edge.target) {
          edge.svg.setAttribute('d', `M ${a.x+55},${a.y-28} C ${a.x+150},${a.y-110} ${a.x-100},${a.y-110} ${a.x-55},${a.y-28}`);
        } else {
          const direction = b.x >= a.x ? 1 : -1;
          const sx = a.x + 102 * direction, tx = b.x - 105 * direction;
          const bend = Math.max(40, Math.abs(tx - sx) / 2);
          edge.svg.setAttribute('d', `M ${sx},${a.y} C ${sx+bend*direction},${a.y} ${tx-bend*direction},${b.y} ${tx},${b.y}`);
        }
      }
    }
    function transform() { $('viewport').setAttribute('transform', `translate(${state.x},${state.y}) scale(${state.scale})`); }
    function fit() {
      if (!state.visible.length) return;
      const box = $('graph').getBoundingClientRect();
      const points = [...state.positions.values()];
      const minX = Math.min(...points.map(p => p.x)) - 125, maxX = Math.max(...points.map(p => p.x)) + 125;
      const minY = Math.min(...points.map(p => p.y)) - 65, maxY = Math.max(...points.map(p => p.y)) + 65;
      state.scale = Math.min(1.15, Math.max(.02, Math.min((box.width - 50) / (maxX - minX), (box.height - 135) / (maxY - minY))));
      state.x = box.width / 2 - (minX + maxX) / 2 * state.scale;
      state.y = box.height / 2 + 14 - (minY + maxY) / 2 * state.scale;
      transform();
    }
    function zoom(factor, x, y) {
      const previous = state.scale;
      state.scale = Math.max(.02, Math.min(6, previous * factor));
      state.x = x - (x - state.x) * state.scale / previous;
      state.y = y - (y - state.y) * state.scale / previous;
      transform();
    }

    function details() {
      const panel = $('details');
      panel.replaceChildren();
      const node = nodes.get(state.selected);
      if (!node) {
        panel.append(element('div', cgTr("GRAFO DELLE CHIAMATE"), 'eyebrow'), element('h2', cgTr("Segui il codice.")), element('p', cgTr("Seleziona un simbolo per esplorare chi lo chiama e cosa chiama."), 'note'));
        const metrics = element('div', undefined, 'metrics');
        for (const [number, label] of [[data.nodes.length, cgTr("nodi esportati")], [data.edges.length, cgTr("collegamenti")]]) {
          const metric = element('div', label, 'metric');
          metric.prepend(element('strong', String(number)));
          metrics.append(metric);
        }
        panel.append(metrics, element('h3', cgTr("Come esplorare")), element('p', cgTr("Cerca un nome o un file, filtra per modulo e seleziona un nodo. Le frecce seguono la direzione delle chiamate. Puoi trascinare i nodi e spostare la vista."), 'note'));
      } else {
        panel.append(element('div', `${names[node.kind] || node.kind} · ${node.language}`, 'eyebrow'), element('h2', node.label), element('div', `${node.file}:${node.line}`, 'location'));
        const copy = element('button', cgTr("Copia posizione"));
        copy.id = 'copy';
        copy.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(`${node.file}:${node.line}`); copy.textContent = cgTr("Copiata"); }
          catch { copy.textContent = cgTr("Seleziona e copia la posizione sopra"); }
        });
        panel.append(copy);
        if (node.signature) panel.append(element('pre', node.signature));
        const relations = [[cgTr("Chiamato da"), incoming.get(node.id), edge => edge.source], [cgTr("Chiama"), outgoing.get(node.id), edge => edge.target]];
        for (const [title, edges, other] of relations) {
          const accepted = edges.filter(allowed);
          panel.append(element('h3', `${title} · ${accepted.length}`));
          if (!accepted.length) panel.append(element('p', cgTr("Nessun collegamento a questa confidenza."), 'note'));
          for (const edge of accepted) {
            const neighbor = nodes.get(other(edge));
            const button = element('button', undefined, 'neighbor');
            button.dataset.id = neighbor.id;
            button.append(element('strong', neighbor.label), element('span', edge.confidence, 'confidence'));
            for (const call of edge.calls.filter(call => ranks[call.confidence] >= ranks[$('confidence').value])) {
              button.append(element('small', `${call.file}:${call.line}`));
            }
            button.addEventListener('click', () => select(neighbor.id));
            panel.append(button);
          }
        }
      }
      panel.append(element('h3', cgTr("Una mappa, da verificare")), element('p', (data.language==='en'?`Static snapshot: dynamic calls and external references may be missing. High means a more direct resolution, not runtime certainty. ${data.dynamic_calls} recognized dynamic calls in this project.`:`Snapshot statico: le chiamate dinamiche e i riferimenti esterni possono mancare. High indica una risoluzione più diretta, non una certezza a runtime. ${data.dynamic_calls} chiamate dinamiche riconosciute nel progetto.`), 'note'));
      if (data.nodes.length < data.total_nodes) panel.append(element('p', (data.language==='en'?`This export contains ${data.nodes.length} of ${data.total_nodes} indexed nodes.`:`Questo export contiene ${data.nodes.length} dei ${data.total_nodes} nodi indicizzati.`), 'note'));
    }

    $('graph').addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      const node = event.target.closest('.node');
      const id = node ? Number(node.dataset.id) : null;
      const position = state.positions.get(id);
      drag = {id, startX: event.clientX, startY: event.clientY, x: position?.x ?? state.x, y: position?.y ?? state.y, moved: false};
      $('graph').setPointerCapture(event.pointerId);
      $('graph').classList.add('dragging');
      event.preventDefault();
    });
    $('graph').addEventListener('pointermove', event => {
      if (!drag) return;
      const dx = event.clientX - drag.startX, dy = event.clientY - drag.startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (drag.id === null) { state.x = drag.x + dx; state.y = drag.y + dy; transform(); }
      else { state.positions.set(drag.id, {x: drag.x + dx / state.scale, y: drag.y + dy / state.scale}); positionGraph(); }
    });
    $('graph').addEventListener('pointerup', () => {
      const ended = drag;
      drag = null;
      $('graph').classList.remove('dragging');
      if (ended && !ended.moved && ended.id !== null) select(ended.id);
    });
    $('graph').addEventListener('pointercancel', () => { drag = null; $('graph').classList.remove('dragging'); });
    $('graph').addEventListener('wheel', event => {
      event.preventDefault();
      const rect = $('graph').getBoundingClientRect();
      zoom(Math.exp(-event.deltaY * .0015), event.clientX - rect.left, event.clientY - rect.top);
    }, {passive: false});
    for (const id of ['zoom-in', 'zoom-out']) $(id).addEventListener('click', () => {
      const rect = $('graph').getBoundingClientRect();
      zoom(id === 'zoom-in' ? 1.25 : .8, rect.width / 2, rect.height / 2);
    });
    $('fit').addEventListener('click', fit);
    $('overview').addEventListener('click', () => { state.selected = null; render(); });
    $('depth').addEventListener('change', () => { state.depth = Number($('depth').value); render(); });
    for (const id of ['search', 'kind', 'module', 'confidence']) $(id).addEventListener(id === 'search' ? 'input' : 'change', () => {
      if (state.selected !== null && !passes(nodes.get(state.selected))) state.selected = null;
      resultLimit = 80;
      render();
    });
    for (const kind of [...new Set(data.nodes.map(node => node.kind))].sort()) {
      const option = element('option', names[kind] || kind);
      option.value = kind;
      $('kind').append(option);
    }
    for (const module of [...new Set(data.nodes.map(node => node.module))].sort()) {
      const option = element('option', module === '.' ? cgTr("Root del progetto") : module);
      option.value = module;
      $('module').append(option);
    }
    $('confidence').value = ranks[data.min_conf] > ranks.medium ? 'high' : data.min_conf;
    document.body.classList.toggle('embedded', Boolean(data.embedded));
    $('project').textContent = data.project;
    $('summary').textContent = `${data.nodes.length} ${data.language==='en'?'nodes':'nodi'} · ${data.edges.length} ${cgTr('collegamenti')}`;
    $('indexed').textContent = `${data.language==='en'?'Indexed':'Indicizzato'} ${data.indexed_at}`;
    document.title = `code-graph · ${data.project}`;
    new ResizeObserver(fit).observe($('graph'));
    render();
  </script>
</body>
</html>
