name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install PHP for native regression tests on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install php@8.4
          echo "$(brew --prefix php@8.4)/bin" >> "$GITHUB_PATH"
      - name: Check native PHP runtime
        run: php --version
      - name: Install pinned dependencies and run selftest
        run: bash scripts/setup.sh
      - name: Validate API catalog
        run: scripts/cg catalog validate
      - name: Run every collected test
        run: .venv/bin/python -I tools/parallel_tests.py --jobs 2
